name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify compiled native libraries
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libHellsMT\.so$' | sort
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libHellsMT.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HellsMountainUnknown-debug-apk
          path: app/build/outputs/apk/debug/*.apk
